services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: sivananda
      POSTGRES_PASSWORD: sivananda123
    ports:
      - "5433:5432"
    volumes:
      - urlshortener_data:/var/lib/postgresql/data
    
  app:
    build: 
      context: .
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    depends_on:
      - db
    env_file: .env

volumes:
  urlshortener_data: